  - {cik: 1422109, ticker: BBLUQ, reason: "Blue Earth Marketing Company is unrelated to Blue Earth Inc"}
  - {cik: 731012, ticker: HCSG, reason: "Healthcare Services of North America JV is unrelated to Healthcare Services Group"}
  - {cik: 1178660, ticker: TUTH, reason: "The Costas Group (DoD awardee) cannot be confirmed as Standard Dental Labs"}
  - {cik: 1357671, ticker: CRTD, reason: "Great Plains Enterprises is unrelated to Creatd"}
  - {cik: 1809987, ticker: MIR, reason: "Canberra was bought by Mirion in 2016; the awards predate the link"}
