# Holdout (FY2009-FY2016): extra companies and recipient names left out
# Author: Tov Binyamin Brog
#
# Added to match_exclusions_v2.yaml for the version 3 holdout test only. Written from
# output/holdout/match_review.csv before any holdout return was computed. USAspending
# shows many recipients under today's parent name, so a few matches point to a company
# that bought the recipient later; those are excluded too.

frozen: "2026-11-27"
exclude:
