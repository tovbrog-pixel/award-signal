# Award Signal - Phase 1 configuration
# Author: Tov Binyamin Brog

# SEC asks every client to identify itself with a name and contact email.
sec_user_agent: "Your Name your.email@example.com"

# Optional, free at alphavantage.co: supplies old tickers and delisting dates
# for companies that have since left the market. Leave blank to skip.
alphavantage_api_key: ""

data_dir: data
output_dir: output

budget:
  first_fy: 2015                 # first request year to load (FY2015 request came out in 2014)
  last_fy: 2027
  areas_file: areas.yaml         # fixed keyword list; freeze it before any backtest
  ramp_multiple: 1.5             # line flag: request at least 1.5x the enacted amount
  ramp_min_request: 20000000     # ... and at least $20M
  new_start_min_request: 10000000  # line flag: new line requesting at least $10M
  # Rising-area rule, version 1, frozen 2026-11-27 before any return was computed:
  area_excess_growth: 0.15       # area request grows 15 points faster than the whole DoD request
  area_min_increase: 100000000   # ... and by at least $100M
  signal_month_day: "07-01"      # signals dated 1 July of the year the request comes out

stages:
  # Stage 2 and 3 rules, version 1, frozen 2026-11-27 before any return was computed
  first_request_fy: 2017         # first signal year with enough award history behind it
  lookback_years: 3              # award history window before each signal date
  exposure_share: 0.25           # exposed: at least 25% of the company's award dollars in the area
  exposure_min_dollars: 7500000  # ... and at least one announcement's worth ($7.5M) in the area
  hold_days: 252                 # about 12 months of trading sessions
  min_positive_share: 0.6        # yearly test: at least 60% of completed years beat IWM

announcements:
  amount: face                   # face (announced value) | obligated (dollars obligated at award)
  include_modifications: false   # only new awards count as signals
  include_multi_award: false     # multiple-award contracts name no single company's dollars

awards:
  source: usaspending            # usaspending | announcements | csv
  csv_path: data/awards.csv      # used when source is csv (for example a HigherGov export)
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  min_amount: 7500000            # DoD announces awards above $7.5M
  award_type_codes: [A, B, C, D] # definitive contracts, purchase orders, delivery orders, BPA calls
  awarding_agency: Department of Defense
  new_awards_only: true          # count an award once, in the month of its first transaction
  # DoD contract actions reach FPDS and USAspending about 90 days after award.
  # The signal date is the action date plus this lag, so the test never trades
  # on data the public could not yet see.
  reporting_lag_days: 90

signal:
  min_award_to_revenue: 0.10     # award must be at least 10% of latest annual revenue
  min_market_cap: 100000000      # $100M
  max_market_cap: 5000000000     # $5B
  horizon_days: 90               # holding period in trading days
  cooldown_days: 126             # calendar days (about 90 trading days); ignore repeat signals on the same stock inside this window
  delay_test_days: 5             # rerun with every signal this many trading days late

prices:
  provider: yfinance             # yfinance | csv
  csv_dir: data/prices           # csv provider: one file per ticker with date,open,high,low,close,volume
  benchmark: IWM

costs:
  position_dollars: 4000         # 4% of a $100,000 fake fund
  # [upper bound of 20-day average dollar volume, half-spread in basis points]
  half_spread_bps_by_adv:
    - [1000000, 150]
    - [10000000, 50]
    - [1.0e+18, 15]
  impact_coefficient_bps: 100    # impact = coefficient * sqrt(position / ADV dollars)

tests:
  in_sample_years: [2015, 2016, 2017]
  test_years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  min_positive_years: 5          # Phase 1 gate: 5 of 8 test years beat IWM after costs
  placebo_draws: 1000
  worst_case_loss: -1.0          # survivorship check: each unpriced trade counted as this net return
  random_seed: 7
