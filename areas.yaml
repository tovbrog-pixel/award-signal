# Technology areas for the rising-area detector
# Author: Tov Binyamin Brog
#
# FROZEN 2026-11-27 (version 1), before any backtest ran, at Tov's direction.
# Do not edit this version. Any change starts version 2 and a new backtest.
# Freezing the list first is what keeps hindsight from choosing the winners.
#
# Each area lists keywords matched, case-insensitive, against budget line
# titles (R-1 program element titles and P-1 line item titles). A line can
# count toward more than one area.

